name: Build and Push to ECR

on:
  push:
    branches:
      - hexiu/dev_reconstruction
      - main
  pull_request:
    branches:
      - hexiu/dev_reconstruction
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "648104168728"
  ECR_REPOSITORY_APP: shanavasa/trader-app
  ECR_REPOSITORY_FRONTEND: shanavasa/trader-frontend
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::648104168728:role/github-actions-trader
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push trader-app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_APP }}:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_APP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push trader-frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Send DingTalk notification on success
        if: success()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "msgtype": "markdown",
              "markdown": {
                "title": "✅ Docker镜像构建成功",
                "text": "### ✅ AI-Trader Docker镜像构建成功\n\n**仓库:** ${{ github.repository }}\n**分支:** ${{ github.ref_name }}\n**提交:** ${{ github.sha }}\n**工作流:** ${{ github.workflow }}\n\n**构建的镜像:**\n1. `${{ env.ECR_REPOSITORY_APP }}:latest`\n2. `${{ env.ECR_REPOSITORY_APP }}:${{ github.sha }}`\n3. `${{ env.ECR_REPOSITORY_FRONTEND }}:latest`\n4. `${{ env.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}`\n\n**ECR地址:**\n- ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_APP }}\n- ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}"
              }
            }' \
            "https://oapi.dingtalk.com/robot/send?access_token=0e2effcc1d395b7c7720101fd66dc6296ff51cc0aaea952661f2a5f8164938c8"

      - name: Send DingTalk notification on failure
        if: failure()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "msgtype": "markdown",
              "markdown": {
                "title": "❌ Docker镜像构建失败",
                "text": "### ❌ AI-Trader Docker镜像构建失败\n\n**仓库:** ${{ github.repository }}\n**分支:** ${{ github.ref_name }}\n**提交:** ${{ github.sha }}\n**工作流:** ${{ github.workflow }}\n\n**错误详情:** 请检查GitHub Actions日志\n\n**查看日志:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }' \
            "https://oapi.dingtalk.com/robot/send?access_token=0e2effcc1d395b7c7720101fd66dc6296ff51cc0aaea952661f2a5f8164938c8"