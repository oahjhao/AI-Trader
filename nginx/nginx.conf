server {
    listen 80;
    listen 8888;
    server_name localhost;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/octet-stream application/x-ndjson;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache static assets (CSS/JS/SVG/images)
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }

    # Data directory: JSON autoindex for API-style directory listing
    location /data/ {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_format json;

        # Cache data files (JSONL/JSON) for 5 minutes
        location ~* \.(jsonl|json|csv)$ {
            expires 5m;
            add_header Cache-Control "public";
        }
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
